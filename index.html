<!DOCTYPE html>
<html lang="en" data-palette="violet">

<head>
  <meta charset="UTF-8">
  <script>
    // Dark on a first visit; the nav toggle stores the visitor's choice.
    (function () {
      try {
        var t = localStorage.getItem("mahedi-mt-theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
      document.documentElement.className += " js";
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080D">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <title>S.M. Mahedi Hasan | MarTech specialist &amp; web developer</title>
  <meta name="description"
    content="MarTech specialist in Dhaka: websites and CMS (HubSpot, WordPress, Webflow), CRM and integrations, email, analytics, paid and social channels, and AI in marketing. The bridge between marketing and engineering.">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
